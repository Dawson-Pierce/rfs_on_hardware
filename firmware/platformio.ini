[platformio]
default_envs = teensy41_phd

# Shared by every env below.
[env]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
    hideakitai/ArduinoEigen @ ^0.3.2
    nanopb/Nanopb @ ^0.4.9

build_flags =
    -std=gnu++17
    -O2
    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_ALIGN_STATICALLY
    -DEIGEN_MPL2_ONLY
    -DBREW_TARGET_HARDWARE
    -DPB_FIELD_32BIT
    "-I../brew/include"
    "-I../protocol"
    "-I.pio/libdeps/${PIOENV}/ArduinoEigen/ArduinoEigen"
    -Wno-deprecated-enum-enum-conversion
    -Wno-unused-parameter
build_unflags =
    -std=gnu++11
    -std=gnu++14

upload_protocol = teensy-cli
monitor_speed = 115200
monitor_port = auto

# Sources shared across all firmware sketches: brew core + protocol codec.
# Each env below adds exactly one main_*.cpp on top of this.
_brew_sources =
    +<../../brew/src/brew/core/filters/*.cpp>
    +<../../brew/src/brew/core/dynamics/*.cpp>
    +<../../brew/src/brew/core/fusion/*.cpp>
    +<../../brew/src/brew/advanced/clustering/*.cpp>
    +<../../protocol/rfs.pb.c>

# -------- Envs: one entry point each --------

[env:teensy41_phd]
# The PHD sketch: GM-PHD + GGIW-PHD + TST-GM-PHD, selected per-Config.
build_src_filter =
    +<main_phd.cpp>
    ${env._brew_sources}

[env:teensy41_glmb]
# The GLMB sketch: delta-GLMB (Gaussian) for starters.
build_src_filter =
    +<main_glmb.cpp>
    ${env._brew_sources}
